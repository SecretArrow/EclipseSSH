set -g status off
# The one thing this config adds to no-status.conf: tmux 3.5a does not ask its terminal about
# synchronized output, so `sync` has to be declared for it to wrap its repaints in `ESC [ ? 2026 h`/`l`.
# Without it no recording can contain a batch, and replaying one proves nothing about what the app does
# with it. See record.py's `--answer` note for the other half of the pair.
set -as terminal-features "*:sync"
