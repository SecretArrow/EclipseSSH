# Tag-triggered release build.
#
# On a `v*` tag push, builds a universal AAB + per-ABI release APKs, signs them
# with the release keystore (loaded from the RELEASE_KEYSTORE_* secrets), and
# publishes a GitHub Release with the artifacts attached.
#
# The release path is the only place the native :freerdp and :linux modules
# build — the per-ABI splits in app/build.gradle.kts engage only for an
# `assembleRelease` invocation with no `bundle` task in the same Gradle call,
# so the workflow runs the bundle first and the APKs second.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (must already exist)
        required: true

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8
  BUILD_TOOLS: '36.0.0'
  COMPILE_SDK: 'android-37.0'
  FREERDP_NDK_VERSION: '29.0.13113456'
  FREERDP_CMAKE_VERSION: '4.1.2'

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4.1.0
        with:
          distribution: temurin
          java-version: '17.0.13'

      - uses: gradle/actions/setup-gradle@v5

      - name: Install Android SDK 37 + build-tools 36.0.0 + NDK 29 + CMake
        run: |
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -fsSLO https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip
          mv cmdline-tools latest
          export ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${FREERDP_NDK_VERSION}" \
            "cmake;3.30.5" > /dev/null
          # FreeRDP pins CMake 4.x, which the SDK manager does not carry.
          pipx install "cmake==${FREERDP_CMAKE_VERSION}"

      - name: Restore release keystore
        run: |
          keystore_dir="$HOME/keystore"
          mkdir -p "$keystore_dir"
          printf '%s' "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$keystore_dir/release.keystore"
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          storeFile=$keystore_dir/release.keystore
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Assemble release AAB (universal)
        run: ./gradlew bundleRelease --no-daemon

      - name: Assemble release APKs (per-ABI + universal)
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign AAB with bundletool (Play-ready)
        run: |
          curl -fsSLO https://github.com/google/bundletool/releases/download/1.17.0/bundletool-all-1.17.0.jar
          java -jar bundletool-all-1.17.0.jar build-apks \
            --bundle=app/build/outputs/bundle/release/app-release.aab \
            --output=app/build/outputs/bundle/release/app.apks \
            --mode=universal

      - uses: actions/upload-artifact@b4b15b8c5c86ac68c5c25ad6f2fdff7d0d8f5c3b # v4.6.2
        with:
          name: release-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/bundle/release/*.apks
          retention-days: 90

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@6b46ae6de9cb4f67feeed5e2c6f5b6766a3b553d # v4.2.0
        with:
          name: release-artifacts
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a47b803d518497f8b04e5d3a1f19 # v2.0.8
        with:
          token: ${{ secrets.GH_PAT }}
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/app/build/outputs/apk/release/*.apk
            artifacts/app/build/outputs/bundle/release/*.aab
