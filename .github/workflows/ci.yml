# CI gate — fast PR gate (~5 min wall clock).
#
# Replaces the 63KB ci.yml from the maragung fork. The old workflow ran 6 jobs
# in series-parallel with native build, lint, unit, assemble, smoke and stress;
# the new one keeps the four cheap jobs and moves the expensive ones (native
# build, instrumented e2e, release) into e2e.yml and release.yml. The audit
# report's figures for test counts and lint findings are still re-derivable
# from this job's outputs — see docs/migration-to-secretarrow.md §2.
#
# Branch protection must require the four check names below (docs, lint,
# unit, assemble); the old combined "Lint, tests, APKs and AAB" check is gone.
# The four run in parallel; wall clock is max(docs, lint, unit, assemble)
# rather than the serial sum, so the cheap jobs do not wait on the expensive
# ones. docs/branch-protection.md and scripts/ci-window.sh's
# PROTECTION_CONTEXTS both carry the same list — check-doc-figures.sh fails
# on any drift between the two.
#
# Pinned to commit SHAs for every `uses:` line so a future tag rewrite cannot
# silently change what the workflow does (tj-actions/changed-files and
# action-gh-release force-push incidents have been real supply-chain vectors).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A follow-up push cancels the in-progress run on the same branch. A
  # pull_request run is NOT cancelled, because a cancelled PR check fails
  # branch protection with a status it cannot recover from.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8
  BUILD_TOOLS: '36.0.0'
  COMPILE_SDK: 'android-37.0'
  MIN_SDK: '28'
  TARGET_SDK: 'android-35'

jobs:
  # The cheapest gate: no JDK, no SDK, no Gradle. Re-derives the figures the
  # documents cite (version numbers, workflow names, repository paths) and
  # fails the build if a release bump left the prose behind. Same shell script
  # the old ci.yml ran; it stays first because a 30-second answer is better
  # than waiting for a Gradle run that fails for the same reason five minutes
  # later.
  docs:
    name: Documentation figures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/check-doc-figures.sh
      - run: python3 scripts/terminal-symbols.py
      - run: python3 scripts/terminal-width.py

  # Lint gate: Spotless ktlint check + Android lintRelease. Spotless is the
  # fast path (ktlint is ~30s); lintRelease is the slow one (~3min) but it is
  # what catches deprecated-API and resource issues that ktlint cannot see.
  # Auto-fixable style issues are handled separately by autofix.yml, which
  # commits `spotlessApply` back to the PR; this job only fails on issues that
  # cannot be auto-fixed.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4.1.0
        with:
          distribution: temurin
          java-version: '17.0.13'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Install Android SDK 37 + build-tools 36.0.0
        run: |
          # The runner image ships Android SDK at $ANDROID_HOME (typically
          # /usr/local/lib/android/sdk); just install the missing packages.
          # Do NOT install a second SDK at $HOME — AGP errors with
          # "Several environment variables and/or system properties contain
          # different paths to the SDK" if ANDROID_HOME points at a different
          # tree than the runner's pre-installed one.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" > /dev/null
      - name: Spotless check (ktlint)
        run: ./gradlew spotlessCheck --no-daemon
      - name: Android lint
        run: ./gradlew lintRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: app/build/reports/
          retention-days: 7

  # Unit-test gate: Robolectric tests against the JVM, no emulator. The
  # legacy ci.yml ran these alongside lint and assemble in a single job; the
  # new workflow splits them out so a unit-test failure does not block the
  # lint report upload, and so the two can run in parallel.
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4.1.0
        with:
          distribution: temurin
          java-version: '17.0.13'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Install Android SDK 37 + build-tools 36.0.0
        run: |
          # The runner image ships Android SDK at $ANDROID_HOME (typically
          # /usr/local/lib/android/sdk); just install the missing packages.
          # Do NOT install a second SDK at $HOME — AGP errors with
          # "Several environment variables and/or system properties contain
          # different paths to the SDK" if ANDROID_HOME points at a different
          # tree than the runner's pre-installed one.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" > /dev/null
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --continue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7

  # Smoke build: assembleDebug APK. Verifies the build graph compiles end-to-end
  # without paying for the release-variant shrinking, signing or per-ABI splits
  # (those run in release.yml on tag). The native :freerdp and :linux modules
  # are skipped here — their native build is the slowest single step and is
  # only required for the release APK. A debug APK without native libs is
  # enough to catch a Compose/Hilt/KSP regression.
  assemble:
    name: Assemble (debug smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4.1.0
        with:
          distribution: temurin
          java-version: '17.0.13'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Install Android SDK 37 + build-tools 36.0.0 + NDK 29
        run: |
          # The runner image ships Android SDK at $ANDROID_HOME (typically
          # /usr/local/lib/android/sdk); just install the missing packages.
          # Do NOT install a second SDK at $HOME — AGP errors with
          # "Several environment variables and/or system properties contain
          # different paths to the SDK" if ANDROID_HOME points at a different
          # tree than the runner's pre-installed one.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;29.0.13113456" > /dev/null
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon -x :freerdp:buildFreerdpNative -x :linux:buildLinuxNative
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
