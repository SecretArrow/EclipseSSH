# Auto-release: every push to main that turns CI green ships a new release.
#
# The flow:
#   1. This workflow fires on the workflow_run event for `ci.yml` completing
#      successfully on branch `main` (not on PRs, not on tags).
#   2. It bumps the patch version in app/build.gradle.kts, the
#      TERMINAL_IDENTITY constant, and AUDIT-REPORT.md - the three places
#      release.yml's v1.23.6 build proved need to stay in sync, or Android
#      refuses the install as a downgrade and the terminal handshake
#      advertises the wrong version.
#   3. It commits the bump, tags it `v<new>`, and pushes the tag.
#   4. The existing `release.yml` (trigger: `push` to `v*` tags) takes over:
#      restores the keystore from the RELEASE_* secrets, verifies it is the
#      canonical release key, builds the per-ABI splits + universal AAB,
#      signs them, verifies every signature, and publishes the GitHub
#      Release with SHA256SUMS.txt attached.
#
# Reusing release.yml rather than duplicating its build keeps a single
# source of truth for signing - the v1.5.0 incident in AUDIT-REPORT.md §56
# shipped the wrong key precisely because there was more than one.
#
# Skip conditions (the job no-ops rather than releases):
#   - The CI run was not on branch `main` (PR runs, tag runs, forks).
#   - The CI run did not conclude `success` (it was cancelled or failed).
#   - The commit that landed was itself this workflow's version bump -
#     otherwise each release re-triggers the next one in an infinite loop.
#     The bump commit's subject starts with `[auto-release]`.
#   - The HEAD commit already carries a tag (a manual release, or this
#     same flow already ran for this commit).
name: Auto-release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: SHA on main to release (defaults to current main)
        required: false

permissions:
  contents: write

jobs:
  cut-release:
    name: Cut patch release for the green main commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The workflow_run event fires for every CI completion, including PRs and
    # cancelled runs; the gate below narrows it to a green run on main. The
    # `if` lives on the job rather than the trigger so workflow_dispatch
    # (manual) still works.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For workflow_run, checkout the SHA that CI just ran on; for
          # workflow_dispatch, checkout the input sha or default to main.
          ref: ${{ github.event.inputs.sha || github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Skip if this commit is already a version bump or already tagged
        id: gate
        run: |
          set -euo pipefail
          HEAD_SUBJECT=$(git log -1 --pretty=%s)
          echo "HEAD subject: $HEAD_SUBJECT"
          case "$HEAD_SUBJECT" in
            "[auto-release]"*)
              echo "HEAD is itself an auto-release version bump - stopping to avoid a loop."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          # Already tagged? A manual release tag on this exact commit means
          # the existing release.yml has run or will run; do not double-tag.
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            echo "HEAD already carries a tag ($(git describe --tags --exact-match HEAD)) - stopping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Bump patch version
        if: steps.gate.outputs.skip != 'true'
        id: bump
        run: |
          set -euo pipefail
          # Read the current versionName from app/build.gradle.kts. The line
          # is `        versionName = "1.23.6"` - capture the dotted triple
          # in the quotes.
          CURRENT=$(grep -E '^\s*versionName = "[0-9]+\.[0-9]+\.[0-9]+"' app/build.gradle.kts | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          if [ -z "$CURRENT" ]; then
            echo "Could not read versionName from app/build.gradle.kts" >&2
            exit 2
          fi
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEXT_PATCH=$((PATCH + 1))
          NEXT="${MAJOR}.${MINOR}.${NEXT_PATCH}"
          echo "Bumping $CURRENT -> $NEXT"
          # Bump versionCode + versionName in app/build.gradle.kts.
          # versionCode is the integer directly above versionName; bump it
          # by one alongside, never reset it.
          CURRENT_CODE=$(grep -E '^\s*versionCode = [0-9]+' app/build.gradle.kts | head -1 | sed -E 's/.*([0-9]+).*/\1/')
          NEXT_CODE=$((CURRENT_CODE + 1))
          sed -i -E "s/^(\s*versionCode = )[0-9]+/\1${NEXT_CODE}/" app/build.gradle.kts
          sed -i -E "s/^(\s*versionName = \")[0-9]+\.[0-9]+\.[0-9]+(\")/\1${NEXT}\2/" app/build.gradle.kts
          # TERMINAL_IDENTITY mirrors versionName - it advertises the
          # version in the terminal handshake (TERM/IDENTITY), so a stale
          # string here ships an APK that lies about its own version.
          sed -i -E "s/EclipseSSH\(${CURRENT}\)/EclipseSSH(${NEXT})/" app/src/main/java/dev/eclipse/ssh/terminal/AnsiTerminalBuffer.kt
          # AUDIT-REPORT.md records the version line a reader greps for.
          sed -i -E "s/versionCode ${CURRENT_CODE} \/ versionName ${CURRENT}/versionCode ${NEXT_CODE} \/ versionName ${NEXT}/" AUDIT-REPORT.md
          echo "new_version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "new_version_code=${NEXT_CODE}" >> "$GITHUB_OUTPUT"
          git diff --stat

      - name: Commit bump and push tag
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEXT="${{ steps.bump.outputs.new_version }}"
          git add app/build.gradle.kts app/src/main/java/dev/eclipse/ssh/terminal/AnsiTerminalBuffer.kt AUDIT-REPORT.md
          git commit -m "[auto-release] v${NEXT}

          Cut automatically by auto-release.yml after CI on main concluded
          success. The tag push below triggers release.yml, which builds,
          signs (RELEASE_* secrets, canonical keystore verified), and
          publishes the per-ABI APK splits + universal AAB + SHA256SUMS.txt."
          git tag -a "v${NEXT}" -m "v${NEXT}"
          git push origin "v${NEXT}"
          echo "Pushed tag v${NEXT}; release.yml will take over from here."

      - name: Report skip
        if: steps.gate.outputs.skip == 'true'
        run: echo "::notice::Auto-release skipped for this commit (already tagged, or it is itself an auto-release bump)."
