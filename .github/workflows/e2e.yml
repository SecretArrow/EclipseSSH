# End-to-end / instrumented tests on an Android emulator matrix.
#
# Runs the androidTest source set against API 28, 30, 33 and 35 in parallel.
# Each API level boots an x86_64 emulator, runs the instrumentation, and
# uploads the test reports. The whole job is the slowest thing in the pipeline
# (~15 min per API level) so it only runs on main push and on PRs that carry
# the `e2e` label — see the `if:` on the trigger. PRs without the label get
# the cheap unit-test gate from ci.yml; the e2e gate runs on merge.
name: E2E

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize, opened]
  workflow_dispatch:

permissions:
  contents: read

# Cancel an in-progress run when a follow-up push lands on the same ref.
# PRs are not cancelled (branch protection).
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8
  BUILD_TOOLS: '36.0.0'
  COMPILE_SDK: 'android-37.0'

jobs:
  # Skip the e2e matrix on PRs unless the `e2e` label is present. The unit-test
  # gate in ci.yml is enough for most PRs; the e2e gate is for changes that
  # touch the terminal renderer, the SSH channel, or the Linux userspace.
  #
  # The skip condition is checked here (job-level) rather than at the workflow
  # level so a `workflow_dispatch` from the Actions tab always runs the matrix
  # regardless of labels.
  matrix-prep:
    name: Decide whether to run the matrix
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ contains(github.event.pull_request.labels.*.name, 'e2e') }}" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  instrumentation:
    name: Instrumented tests (API ${{ matrix.api-level }})
    needs: matrix-prep
    if: needs.matrix-prep.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # All four API levels gate. API 33/35 used to run non-gating because
      # "tests that launch the real MainActivity never reach RESUMED on the
      # swiftshader emulators" - that diagnosis was wrong. The logcat of run
      # 42939683291 shows what actually happened: MainActivity reached RESUMED
      # and 200ms later the system Displayed GrantPermissionsActivity, because
      # the app asks for POST_NOTIFICATIONS on first launch and that permission
      # only exists as a runtime permission from API 33. The dialog parked the
      # activity at STARTED and 19 Compose tests failed in a cascade
      # ("No compose hierarchies found", "Activity never becomes requested
      # state RESUMED"). The script step below installs the APK and pre-grants
      # the permission before the tests, which removes the dialog entirely.
      matrix:
        include:
          - api-level: 28
            target: default
            arch: x86
          - api-level: 30
            target: google_apis
            arch: x86_64
          - api-level: 33
            target: google_apis
            arch: x86_64
          - api-level: 35
            target: google_apis
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Grant KVM access to the runner user
        # Some ubuntu-24.04 runner images ship /dev/kvm but the runner user
        # is not in the kvm group ("ProbeKVM: This user doesn't have
        # permissions to use KVM" in run 42370740804). Without KVM the
        # emulator falls back to TCG software emulation: boots take 4-13
        # minutes and the guest freezes mid-test with
        # ShellCommandUnresponsiveException, which gradle reports as
        # "Skipping device 'test(AVD)': Unknown API Level / No compatible
        # devices connected". chmod on the device node is enough - the
        # emulator probes access with open(), not group membership.
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::no /dev/kvm on this runner - emulator will use TCG"
          fi
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v4.1.0
        with:
          distribution: temurin
          java-version: '17.0.13'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Install Android SDK 37 + build-tools 36.0.0 + NDK 29
        run: |
          # The runner image ships Android SDK at $ANDROID_HOME (typically
          # /usr/local/lib/android/sdk); just install the missing packages.
          # Do NOT install a second SDK at $HOME — AGP errors with
          # "Several environment variables and/or system properties contain
          # different paths to the SDK" if ANDROID_HOME points at a different
          # tree than the runner's pre-installed one.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;29.0.13113456" \
            "system-images;android-${{ matrix.api-level }};${{ matrix.target }};${{ matrix.arch }}" > /dev/null
      - name: Pre-build the debug + test APKs (before the emulator boots)
        # Building the APKs (incl. the 12-minute freerdp/openssl native
        # build) here, with no emulator consuming RAM, avoids the guest
        # freezing mid-test on slow TCG runners (run 42361822914: the
        # emulator's adb shell went ShellCommandUnresponsiveException and
        # the device was reported as 'Unknown API Level' / skipped while
        # the native build was still running inside the test step).
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Boot the emulator and run the connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          # 1500s because hosted runners occasionally fall back to TCG
          # (software) emulation - run 42358490486 saw a 773s boot and
          # hung at the 600s default on all four matrix entries.
          emulator-boot-timeout: 1500
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          # The APKs are already built by the pre-build step above, so this
          # invocation only installs them and runs the tests - no native
          # build competing with the running emulator.
          #
          # Pre-grant POST_NOTIFICATIONS on API >= 33 before running: the app
          # legitimately asks for it on first launch (MainActivity's
          # LaunchedEffect), but the permission dialog it raises parks the
          # activity at STARTED and every Compose assertion fails after that
          # ("No compose hierarchies found" x19 on run 42939683291). Granting
          # it up front removes the dialog; on API < 33 the permission does
          # not exist and the grant is skipped. The debug build carries the
          # ".debug" applicationIdSuffix.
          #
          # ONE LINE, because the emulator-runner executes this input LINE BY
          # LINE - each line as its own `sh -c` - so a multi-line if/fi died
          # with "Syntax error: end of file unexpected (expecting fi)" on run
          # 42943921831 before any test ran. The `;` before gradlew means a
          # refused grant on API < 33 does not stop the tests; gradle's own
          # exit code is the verdict.
          #
          # UbuntuE2eVerificationTest is excluded: it is gated by
          # -e ubuntuE2e true (an instrumentation arg) because it expects
          # the deep-verification Ubuntu rootfs the separate
          # android-ubuntu-e2e pipeline installs through the UI driver
          # first. Without that arg AGP 8.x reports the AssumptionViolatedException
          # raised in @Before as a *failure* instead of a skip, which
          # is what turned all 16 of its methods red on run 42366128825
          # (API 35). The CI matrix never has that rootfs, so the test
          # simply does not belong here.
          script: adb install -r app/build/outputs/apk/debug/app-debug.apk && adb shell pm grant dev.eclipse.ssh.debug android.permission.POST_NOTIFICATIONS; ./gradlew connectedDebugAndroidTest --no-daemon --continue -Pandroid.testInstrumentationRunnerArguments.notClass=dev.eclipse.ssh.linux.UbuntuE2eVerificationTest
      # Retry once: hosted runners fall back to TCG software emulation
      # when KVM is unavailable, and on those runs Compose idles past the
      # 10-second test timeout ("No compose hierarchies found",
      # "IdlingResourceTimeoutException") and the golden-render tests hit
      # swiftshader color-buffer corruption ("bad color buffer handle",
      # "expected to be true"). Re-booting a fresh emulator and re-running
      # is the standard remedy; if it fails twice it is a real regression.
      - name: Boot the emulator and run the connected tests (retry)
        id: retry
        if: failure()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: true
          emulator-boot-timeout: 1500
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          # Same pre-grant discipline on the retry (one line - see the comment
          # above for why): a fresh emulator means a fresh permission state.
          script: adb install -r app/build/outputs/apk/debug/app-debug.apk && adb shell pm grant dev.eclipse.ssh.debug android.permission.POST_NOTIFICATIONS; ./gradlew connectedDebugAndroidTest --no-daemon --continue -Pandroid.testInstrumentationRunnerArguments.notClass=dev.eclipse.ssh.linux.UbuntuE2eVerificationTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: instrumented-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTest/
            app/build/outputs/androidTest-results/
          retention-days: 7
